services:
  - type: web
    name: yo-beauty
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w server && npm run build -w client
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_TIMEZONE
        value: America/Recife
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ANALYTICS_HASH_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
